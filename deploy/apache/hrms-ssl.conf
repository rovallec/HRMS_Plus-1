<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName my.cxperts.us
    ServerAdmin webmaster@localhost

    SSLEngine on
    DocumentRoot /var/www/hrms/dist/HRMS_Plus/browser

    <Directory /var/www/hrms/dist/HRMS_Plus/browser>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_URI} !\.(js|css|png|jpg|jpeg|gif|svg|ico|json|txt|woff2?|eot|ttf)$ [NC]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^.*$ /index.html [L]
        </IfModule>

        <FilesMatch "\.html$">
            SetEnv no-gzip 1
            Header always set Cache-Control "no-cache, no-store, must-revalidate"
            Header always set Pragma "no-cache"
            Header always set Expires "0"
        </FilesMatch>

        <FilesMatch "\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|eot|ttf)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </Directory>

    Alias /api/ /var/www/hrms/restApi/

    <Directory /var/www/hrms/restApi>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch "^\.env">
            Require all denied
        </FilesMatch>

        Header always set Cache-Control "no-store"
        Header always set Pragma "no-cache"
    </Directory>

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always unset X-Frame-Options
        Header always set Content-Security-Policy "frame-ancestors 'self' https://cxperts-63539.zendesk.com https://*.zdusercontent.com; object-src 'none'; base-uri 'self';"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    </IfModule>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/hrms_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/hrms_ssl_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/my.cxperts.us/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/my.cxperts.us/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
